[project]
name = "olimpus-interagents"
version = "0.1.0"
description = "Local messaging bus for AI agent sessions on the same machine."
authors = [{name = "OlimpusSoft", email = "dev@olimpussoft.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
  "websockets>=12.0,<14.0",
  "psutil>=5.9",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
pytest-asyncio = ">=0.23"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
